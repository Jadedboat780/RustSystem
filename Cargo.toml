[workspace]
resolver = "3"
members = [
    "kernel-lib",
]
exclude = ["boot"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
bootloader_api = "0.11.17"
embedded-graphics = "0.8.2"
linked_list_allocator = "0.10.6"
x86_64 = "0.15.5"
uart_16550 = "0.9.0"
pic8259 = "0.11.0"
log = "0.4.35"
kernel-lib = { path = "kernel-lib" }

[workspace.lints.clippy]
missing_safety_doc = "allow"

[package]
name = "rust-system"
version = "0.0.2"
edition = "2024"

[dependencies]
bootloader_api.workspace = true
x86_64.workspace = true
pic8259.workspace = true
kernel-lib.workspace = true
log.workspace = true

[lints]
workspace = true

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

[[test]]
name = "should_panic"
harness = false

[[test]]
name = "stack_overflow"
harness = false

[[test]]
name = "guard_page"
harness = false
