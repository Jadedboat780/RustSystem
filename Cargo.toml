[workspace]
resolver = "3"
members = [
    "kernel-lib",
]
exclude = ["boot"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
bootloader_api = "0.11.17"
embedded-graphics = "0.8.2"
linked_list_allocator = "0.9.0"
x86_64 = "0.15.5"
uart_16550 = "0.6.0"
pic8259 = "0.11.0"
kernel-lib = { path = "kernel-lib" }

[package]
name = "rust-system"
version = "0.0.2"
edition = "2024"

[dependencies]
bootloader_api.workspace = true
x86_64.workspace = true
pic8259.workspace = true
kernel-lib.workspace = true

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

[[test]]
name = "should_panic"
harness = false

[[test]]
name = "stack_overflow"
harness = false
